<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Events Checker</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 30px; background: #f8f9fa; color: #333; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { font-size: 22px; margin-bottom: 20px; }
    .form-group { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    input, button { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    button { background: #0066cc; color: #fff; border: none; cursor: pointer; }
    button:hover { background: #0052a3; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #e0e0e0; padding: 10px; text-align: left; font-size: 13px; }
    th { background: #f1f3f5; }
    pre { margin: 0; font-family: monospace; font-size: 11px; }
    .stats-card { background: #e7f5ff; border: 1px solid #a5d8ff; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    function App() {
      const [userId, setUserId] = React.useState('42');
      const [startTime, setStartTime] = React.useState(() => {
        const d = new Date(); d.setDate(d.getDate() - 1); return d.toISOString().slice(0, 16);
      });
      const [endTime, setEndTime] = React.useState(() => new Date().toISOString().slice(0, 16));

      const [events, setEvents] = React.useState([]);
      const [stats, setStats] = React.useState(null);
      const [loading, setLoading] = React.useState(false);
      const [error, setError] = React.useState('');

      const fetchData = async () => {
        if (!userId) return;
        setLoading(true);
        setError('');

        const isoStart = new Date(startTime).toISOString();
        const isoEnd = new Date(endTime).toISOString();

        try {
          const resEvents = await fetch(`/events?user_id=${userId}&start_time=${isoStart}&end_time=${isoEnd}`);
          if (!resEvents.ok) throw new Error(`Events error: ${resEvents.statusText}`);
          const dataEvents = await resEvents.json();
          setEvents(dataEvents);

          const resStats = await fetch(`/stats/${userId}?start_time=${isoStart}&end_time=${isoEnd}`);
          if (resStats.ok) {
            const dataStats = await resStats.json();
            setStats(dataStats);
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="container">
          <h1>User Events Viewer</h1>

          <div className="form-group">
            <input type="number" placeholder="User ID" value={userId} onChange={e => setUserId(e.target.value)} />
            <input type="datetime-local" value={startTime} onChange={e => setStartTime(e.target.value)} />
            <input type="datetime-local" value={endTime} onChange={e => setEndTime(e.target.value)} />
            <button onClick={fetchData} disabled={loading}>{loading ? 'Loading...' : 'Fetch Data'}</button>
          </div>

          {error && <div style={{color: 'red', marginBottom: 15}}>{error}</div>}

          {stats && (
            <div className="stats-card">
              <strong>Total aggregated events for period:</strong> {stats.total_events}
            </div>
          )}

          <h3>Events List ({events.length})</h3>
          {events.length === 0 ? <p>No events found</p> : (
            <table>
              <thead>
                <tr>
                  <th>Event ID</th>
                  <th>Action</th>
                  <th>Object</th>
                  <th>Timestamp</th>
                  <th>Metadata</th>
                </tr>
              </thead>
              <tbody>
                {events.map((ev, i) => (
                  <tr key={ev.event_id || i}>
                    <td>{ev.event_id}</td>
                    <td><strong>{ev.action}</strong></td>
                    <td>{ev.action_object_type ? `${ev.action_object_type}:${ev.action_object_id}` : '-'}</td>
                    <td>{new Date(ev.timestamp).toLocaleString()}</td>
                    <td><pre>{JSON.stringify(ev.metadata, null, 2)}</pre></td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
