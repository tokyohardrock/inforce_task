server:
  addr: ":8080"
  read_header_timeout: 2s
  read_timeout: 5s
  write_timeout: 10s
  idle_timeout: 30s
  max_header_bytes: 1048576

db:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "secretpassword"
  name: "events_db"
  ssl_mode: "disable"
  pool_config:
    max_conns: 25
    min_conns: 5
    max_conn_idle_time: 15m
